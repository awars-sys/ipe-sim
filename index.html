<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>IPE Dental Collaborator</title>
<style>
/* Layout: desktop EHR workstation (laptop-first). Storyboard | chart area | Secure Chat with Q1-Q4 timeline.
   Deliberately single light theme, like a real clinical system; every colour is set explicitly. */
:root{
  --e-chrome:#24405f; --e-chrome-2:#2f5479; --e-chrome-fg:#f2f6fa;
  --e-pane:#f4f6f8; --e-white:#ffffff; --e-line:#c6cfd9; --e-line-2:#dfe5eb;
  --e-head:#e7edf3; --e-tab:#d8e2ec; --e-sel:#cfe3f6; --e-hover:#eaf2fa;
  --e-text:#1b2631; --e-sub:#56636f; --e-link:#0a5fa3;
  --e-story:#e6edf4; --e-story-line:#c9d6e3;
  --e-alert:#b3261e; --e-alert-bg:#fdecea;
  --e-bpa:#fff4cc; --e-bpa-line:#e2c35a;
  --e-ok:#2e7d32; --e-ok-bg:#e5f3e6; --e-warn:#8a5a00; --e-warn-bg:#fff1d6;
  --e-train:#f7d046; --e-me:#dbeafa; --e-them:#ffffff; --e-hint:#f3ecff; --e-hint-line:#cdbbf0; --e-hint-fg:#4b2f86;
  --e-desk:#d9e0e7;
  --font:"Segoe UI",Tahoma,Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--e-desk);color:var(--e-text);font-family:var(--font);font-size:13px;line-height:1.45;padding-inline:16px;padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--e-link);outline-offset:1px}
.scroller{height:100%;overflow:auto;border-radius:6px;box-shadow:0 2px 10px rgba(20,40,60,.18)}
.app{min-width:1280px;height:100%;min-height:660px;display:grid;grid-template-rows:auto auto auto 1fr;background:var(--e-pane);border:1px solid var(--e-line)}

/* Top chrome */
.train{background:var(--e-train);color:#3b2f00;font-weight:700;font-size:11px;letter-spacing:.06em;text-align:center;padding:3px 8px;text-transform:uppercase}
.top{display:flex;align-items:center;gap:2px;background:var(--e-chrome);color:var(--e-chrome-fg);padding:0 8px;height:36px}
.logo{font-weight:700;padding:0 12px 0 4px;border-right:1px solid rgba(255,255,255,.2);margin-right:6px;display:flex;align-items:center;gap:7px}
.logo i{width:14px;height:14px;border-radius:3px;background:#7fb4e6;display:inline-block}
.top .act{background:none;border:0;color:inherit;padding:6px 10px;border-radius:3px}
.top .act:hover{background:var(--e-chrome-2)}
.top .sp{flex:1}
.engine{font-size:11px;background:rgba(255,255,255,.14);border-radius:10px;padding:2px 9px;margin-right:8px}
.top .user{font-size:11.5px;opacity:.85}
.ptabs{display:flex;gap:2px;background:var(--e-chrome-2);padding:4px 8px 0}
.ptab{background:var(--e-tab);color:var(--e-text);padding:5px 14px;border:0;border-radius:4px 4px 0 0;font-size:12.5px;display:flex;gap:8px;align-items:center}
.ptab:hover{background:#e6edf4}
.ptab.on{background:var(--e-pane);font-weight:600}
.ptab small{font-weight:400;color:var(--e-sub)}

/* Body grid */
.body{display:grid;grid-template-columns:210px minmax(0,1fr) minmax(560px,40%);min-height:0}
.story{background:var(--e-story);border-right:1px solid var(--e-story-line);padding:12px;display:flex;flex-direction:column;gap:9px;overflow:auto}
.photo{width:54px;height:54px;border-radius:50%;background:#b9c9da;display:grid;place-items:center;font-weight:700;color:#3b5671;font-size:17px}
.pname{font-size:16px;font-weight:700}
.pmeta{color:var(--e-sub);font-size:11.5px}
.sb{border-top:1px solid var(--e-story-line);padding-top:7px;display:grid;gap:3px}
.sbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--e-sub);font-weight:600}
.allergy{background:var(--e-white);color:var(--e-sub);padding:3px 6px;border-radius:3px;border-left:3px solid var(--e-line)}
.flag{display:inline-block;background:#fff;border:1px solid var(--e-line);border-radius:3px;padding:1px 6px;font-size:11px;margin:1px 2px 1px 0}
.flag.warn{background:#fff1e0;border-color:#e7a54a;color:#7a4500}
.flag.draft{background:#f3ecff;border-color:var(--e-hint-line);color:var(--e-hint-fg)}
.abn{color:var(--e-alert);font-weight:700}

.main{display:grid;grid-template-columns:132px minmax(0,1fr);min-height:0}
.acts{background:var(--e-white);border-right:1px solid var(--e-line);padding:6px 0;display:flex;flex-direction:column}
.acts button{background:none;border:0;text-align:left;padding:8px 12px;color:var(--e-text);border-left:3px solid transparent}
.acts button:hover{background:var(--e-hover)}
.acts button.on{background:var(--e-sel);border-left-color:var(--e-link);font-weight:600}
.acts button[hidden]{display:none}
.work{padding:10px;display:flex;flex-direction:column;gap:10px;overflow:auto;min-width:0}

.bpa{background:var(--e-bpa);border:1px solid var(--e-bpa-line);border-radius:3px;padding:9px 11px;display:grid;gap:6px}
.bpa .t{font-weight:700;font-size:12px}
.bpa .q{font-size:13.5px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{background:var(--e-white);border:1px solid var(--e-line);border-radius:3px;padding:4px 11px;color:var(--e-text)}
.btn:hover{background:var(--e-hover)}
.btn.pri{background:var(--e-link);border-color:var(--e-link);color:#fff}
.btn.pri:hover{background:#084f88}
.btn.hint{background:var(--e-hint);border-color:var(--e-hint-line);color:var(--e-hint-fg)}
.btn.danger{color:var(--e-alert);border-color:#e3aaa6}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--e-white);border:1px solid var(--e-line);border-radius:3px;min-width:0}
.ph{background:var(--e-head);border-bottom:1px solid var(--e-line);padding:6px 10px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ph span{font-weight:400;color:var(--e-sub);font-size:11.5px}
.pb{padding:10px 12px;display:grid;gap:8px}
.pb p{margin:0;max-width:85ch}
table.grid{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.grid th{background:var(--e-head);text-align:left;font-weight:600;padding:5px 9px;border-bottom:1px solid var(--e-line);white-space:nowrap}
.grid td{padding:5px 9px;border-bottom:1px solid var(--e-line-2);vertical-align:top}
.grid tr:last-child td{border-bottom:0}
.grid td.lbl{color:var(--e-sub);width:180px}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:10px;padding:1px 9px;white-space:nowrap}
.pill.met{background:var(--e-ok-bg);color:var(--e-ok)}
.pill.partly{background:var(--e-warn-bg);color:var(--e-warn)}
.pill.not{background:var(--e-alert-bg);color:var(--e-alert)}
.pill.none{background:var(--e-head);color:var(--e-sub)}
.pts{display:flex;flex-wrap:wrap;gap:4px}
.pt{font-size:11.5px;border-radius:3px;padding:1px 6px;border:1px solid var(--e-line-2)}
.pt.y{background:var(--e-ok-bg);border-color:#b7dcb9}
.pt.n{background:#fff;color:var(--e-sub)}
.qlist{margin:0;padding-left:20px;display:grid;gap:8px}
.qlist li span{color:var(--e-sub);font-size:11.5px}
.fbtext{background:var(--e-pane);border-left:3px solid var(--e-link);padding:9px 11px;font-size:13.5px}
.transcript{width:100%;height:160px;font:12px/1.45 Consolas,monospace;border:1px solid var(--e-line);border-radius:3px;padding:8px;resize:vertical;color:var(--e-text);background:var(--e-white)}
.refl{margin:0;padding-left:20px;display:grid;gap:4px}

/* Chat */
.chat{background:var(--e-white);border-left:1px solid var(--e-line);display:grid;grid-template-rows:auto auto 1fr auto;min-height:0}
.ch{background:var(--e-chrome);color:var(--e-chrome-fg);padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
.ch small{display:block;opacity:.8;font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;background:#5bd37a;display:inline-block;margin-right:6px}
.ch .btn{background:transparent;color:var(--e-chrome-fg);border-color:rgba(255,255,255,.35);font-size:11.5px;padding:3px 9px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);padding:10px 8px 8px;background:var(--e-head);border-bottom:1px solid var(--e-line)}
.step{display:grid;justify-items:center;gap:2px;position:relative;background:none;border:0;padding:0;color:var(--e-sub);cursor:default}
.step::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:3px;background:var(--e-line);z-index:0}
.step:first-child::before{display:none}
.step.done::before,.step.now::before{background:var(--e-link)}
.step .d{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--e-white);border:2px solid var(--e-line);position:relative;z-index:1}
.step.done{cursor:pointer;color:var(--e-text)}
.step.done .d{background:var(--e-link);border-color:var(--e-link);color:#fff}
.step.now{color:var(--e-text)}
.step.now .d{border-color:var(--e-link);color:var(--e-link);box-shadow:0 0 0 3px #cfe3f6}
.step b{font-size:11px}
.step span{font-size:10.5px;line-height:1.2}
.step.done:hover b{text-decoration:underline}
.msgs{overflow:auto;background:#f7f9fb;min-height:0}
.thread{padding:12px;display:flex;flex-direction:column;gap:9px}
.m{max-width:88%;padding:7px 10px;border-radius:7px;border:1px solid var(--e-line-2);background:var(--e-them);white-space:pre-wrap;word-wrap:break-word}
.m .who{font-size:10.5px;color:var(--e-sub);margin-bottom:2px;white-space:normal}
.m.me{align-self:flex-end;background:var(--e-me);border-color:#bcd6f0}
.m.hint{background:var(--e-hint);border-color:var(--e-hint-line)}
.m.hint .who{color:var(--e-hint-fg);font-weight:600}
.m.share{background:#f0f7ee;border-color:#bfdcb9}
.m.share .who{color:var(--e-ok);font-weight:600}
.sys{align-self:center;font-size:10.5px;color:var(--e-sub);background:var(--e-head);padding:2px 10px;border-radius:10px}
.div{align-self:stretch;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--e-link);margin-top:4px}
.div::before,.div::after{content:"";flex:1;height:1px;background:var(--e-line)}
.card{align-self:stretch;border:1px solid var(--e-line);border-radius:6px;background:var(--e-white);padding:10px 11px;display:grid;gap:8px}
.card h4{margin:0;font-size:12.5px}
.card p{margin:0}
.opt{text-align:left;background:var(--e-pane);border:1px solid var(--e-line);border-radius:5px;padding:7px 9px;display:grid;grid-template-columns:22px 1fr;gap:6px;color:var(--e-text)}
.opt:hover:not(:disabled){background:var(--e-hover);border-color:var(--e-link)}
.opt b{color:var(--e-link)}
.opt.picked{border-color:var(--e-link);background:var(--e-sel)}
.opt:disabled{cursor:default}
.typing{align-self:flex-start;font-size:11px;color:var(--e-sub);font-style:italic}
.guide{display:grid;gap:7px;margin:0;padding:0;list-style:none;counter-reset:g}
.guide li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.guide li::before{counter-increment:g;content:counter(g);width:20px;height:20px;border-radius:50%;background:var(--e-sel);color:var(--e-link);font-weight:700;font-size:11px;display:grid;place-items:center}
.compose{border-top:1px solid var(--e-line);padding:8px;display:grid;gap:6px;background:var(--e-white)}
.compose textarea{width:100%;resize:vertical;min-height:84px;height:84px;max-height:240px;border:1px solid var(--e-line);border-radius:3px;padding:6px 7px;font:inherit;color:var(--e-text);background:var(--e-white)}
.compose .row{justify-content:space-between}
.tries{font-size:11px;color:var(--e-sub)}
.confirm{background:var(--e-alert-bg);border:1px solid #e3aaa6;border-radius:4px;padding:6px 8px;display:flex;gap:6px;align-items:center;justify-content:space-between;font-size:12px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(20,32,45,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal .box{background:var(--e-white);border-radius:6px;max-width:620px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden}
.modal .ph{font-size:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--e-text);color:#fff;padding:7px 14px;border-radius:5px;font-size:12.5px;z-index:30}
/* Reference values + resources */
.grid td.ref{min-width:250px}
.bands{display:grid;gap:1px}
.bands span{font-size:11.5px;color:var(--e-sub);padding:0 5px;border-radius:3px}
.bands span.hit{background:var(--e-sel);color:var(--e-text);font-weight:700}
.src{display:block;font-size:10.5px;color:var(--e-sub);margin-top:3px;padding-left:5px}
.foot{border-top:1px solid var(--e-line-2);padding:7px 10px;font-size:11.5px;color:var(--e-sub);line-height:1.5}
.foot a,.ph a{color:var(--e-link)}
.grid.res td:first-child{width:150px}
.sub{font-size:11px;color:var(--e-sub)}
ul.tight{margin:4px 0 0;padding-left:18px}
/* Highlighter */
mark.hl{background:#fff176;color:inherit;border-radius:2px;padding:0 1px;cursor:pointer;box-shadow:0 0 0 1px #f2d63c}
mark.hl:hover{background:#ffe94d;text-decoration:line-through;text-decoration-color:rgba(0,0,0,.35)}
.hl-float{position:fixed;z-index:40;background:#fff176;border:1px solid #d4b81f;color:#3b2f00;font-weight:700;border-radius:4px;padding:4px 10px;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:12px}
.hl-float:hover{background:#ffe94d}
.hlbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fffbe0;border:1px solid #efe08a;border-radius:3px;padding:6px 10px;font-size:12px;color:#5a4a00}
.hlbar .sw{display:inline-block;width:12px;height:12px;background:#fff176;border:1px solid #d4b81f;border-radius:2px;vertical-align:-2px;margin-right:4px}
.hlbar .sp{flex:1}
.hlchips{display:flex;flex-wrap:wrap;gap:5px}
.hlchip{background:#fff176;border:1px solid #e6cf3a;border-radius:3px;padding:1px 7px;font-size:12px}
[data-hlk]{cursor:text}
.rules{background:#fffbe0;border:1px solid #efe08a;border-radius:5px;padding:8px 10px;display:grid;gap:4px}
.rules ul{margin:0;padding-left:18px;display:grid;gap:3px}
.qguide td:first-child{width:170px}
.qguide ul{margin:4px 0 0;padding-left:18px}
.part{font-size:10.5px;color:var(--e-link);font-weight:700}
[hidden]{display:none!important}
.noscript{max-width:640px;margin:40px auto;background:#fff;border:1px solid var(--e-line);border-radius:6px;padding:16px 18px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="scroller">
<div class="app" id="app">
  <div class="train">Training environment · simulated patient · not for clinical use</div>
  <div class="top">
    <span class="logo"><i></i>IPE Sim EHR</span>

      <nav class="acts" id="acts" aria-label="Chart activities">
        <button type="button" data-view="chart" class="on">Chart Review</button>

</div>
</div>

<div class="modal" id="modal" hidden>

  </div>
</div>

<script>
/* =====================================================================
   CONFIG: change these without touching the rest of the file
   ===================================================================== */
const CONFIG = {
  engine: "practice",                  // "claude" = live, via the Netlify function. "practice" = offline keyword engine (no cost)
  apiUrl: "/api/maya",                 // the Netlify function's address (set in netlify/functions/maya.mjs)
  botName: "Maya Chen",
  botRole: "Dental Student (D2)",
  maxTries: 3,                         // tries per question before Maya moves on
  maxHints: 3,                         // "Ask Maya for a hint" presses allowed per case
  caseOrder: ["margaret", "lucy", "brian"],
  startCase: "margaret"
};

// Add ?practice to the link (e.g. yoursite.netlify.app/?practice) to use the free offline engine.
if (new URLSearchParams(location.search).has("practice")) CONFIG.engine = "practice";

const STEPS = [
  {k:"Q1", label:"Scope of practice"},
  {k:"Q2", label:"Referrals"},
  {k:"Q3", label:"Treatment plan"},
  {k:"Q4", label:"Joint plan"},
  {k:"End", label:"Feedback"}
];

/* =====================================================================
   REFERENCE SCALES (shown in the Tobacco tab and IPE Resources)
   ===================================================================== */
const LINKS = {
  ftnd: "https://www.aarc.org/wp-content/uploads/2014/08/Fagerstrom_test.pdf",
  co: "https://www.asthmaandlung.org.uk/symptoms-tests-treatments/tests/exhaled-carbon-monoxide",
  ready: "https://casaa.unm.edu/assets/inst/readiness-ruler.pdf",
  fiveD: "https://www.rwjbh.org/blog/2025/may/manage-nicotine-craving-with-the-5-ds-of-quittin/"
};
function bands(list, hit){
  return `<div class="bands">${list.map((b,i)=>`<span class="${i===hit?"hit":""}">${b}</span>`).join("")}</div>`;
}
const FTND = ["1–2 = low dependence","3–4 = low to moderate dependence","5–7 = moderate dependence","8+ = high dependence"];
const ftndRef = (score) => bands(FTND, score==null?-1:score<=2?0:score<=4?1:score<=7?2:3) + `<span class="src">Fagerström Test<sup>1</sup></span>`;
const CO = ["1–4 ppm: low, normal even in non-smokers","5–9 ppm: mild, may smoke or be exposed to second-hand smoke","10+ ppm: high, common if you smoke"];
const coRef = (ppm) => bands(CO, ppm<5?0:ppm<10?1:2) + `<span class="src">Exhaled CO test<sup>2</sup> · case sheet: &lt;6 ppm non-smoker</span>`;
const TTFC = ["Within 5 minutes = 3 points","5–30 minutes = 2 points","31–60 minutes = 1 point"];
const ttfcRef = (i) => bands(TTFC, i) + `<span class="src">Fagerström item 1<sup>1</sup></span>`;
const CPD = ["10 or less = 0 points","11–20 = 1 point","21–30 = 2 points","31 or more = 3 points"];
const cpdRef = (i) => bands(CPD, i) + `<span class="src">Fagerström item 4<sup>1</sup></span>`;
const READYB = ["0–2 = not ready to change","3–5 = unsure (ambivalent)","6–9 = ready to change","10 = already trying to change"];
const readyRef = (score, note) => bands(READYB, score<=2?0:score<=5?1:score<=9?2:3) + `<span class="src">Readiness ruler<sup>3</sup>${note?" · "+note:""}</span>`;

/* =====================================================================
   STATE
   ===================================================================== */
const S = {};
let cur = CONFIG.startCase;
let view = "chart";
let busy = false;

function st(id){
  if(!S[id]){
    const n = CASES[id].qs.length;
    const el = document.createElement("div"); el.className = "thread"; el.dataset.case = id;
    S[id] = {started:false, ended:false, q:0, tries:Array(n).fill(0), hint:Array(n).fill(0),
             met:Array.from({length:n},()=>({})), via:Array(n).fill(null), closed:Array(n).fill(false),
             awaiting:false, picked:Array(n).fill(null), log:[], el, guideShown:false, rubricShown:false,
             hintsUsed:0, qtext:Array(n).fill(""), hl:[]};
  }
  return S[id];
}

/* =====================================================================
   HELPERS
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const now = () => new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),1800); }
function scrollChat(){ const m=$("msgs"); m.scrollTop = m.scrollHeight; }

function push(id, msg){
  const s = st(id); msg.time = msg.time || now(); if(msg.q==null) msg.q = s.q; s.log.push(msg);
  let el;
  if(msg.type==="sys"){ el=document.createElement("div"); el.className="sys"; el.textContent=msg.text; }
  else if(msg.type==="div"){ el=document.createElement("div"); el.className="div"; el.id=`${id}-div-${msg.q}`; el.textContent=msg.text; }
  else if(msg.type==="card"){ el=document.createElement("div"); el.className="card"; el.innerHTML=msg.html; }
  else {
    el=document.createElement("div");
    const cls = msg.type==="me" ? "me" : msg.type==="hint" ? "hint" : msg.type==="share" ? "share" : "";
    el.className = "m " + cls;
    const who = msg.type==="me" ? "You" : msg.type==="hint" ? `Hint from ${CONFIG.botName.split(" ")[0]}` : msg.type==="share" ? `${CONFIG.botName.split(" ")[0]} shares a complete answer` : CONFIG.botName;
    el.innerHTML = `<div class="who">${who} · ${msg.time}</div>${esc(msg.text)}`;
  }
  s.el.appendChild(el);
  if(id===cur) scrollChat();
  return el;
}

async function maya(id, items){
  busy = true; syncCompose();
  for(const it of items){
    const t = document.createElement("div"); t.className="typing"; t.textContent=`${CONFIG.botName.split(" ")[0]} is typing…`;
    st(id).el.appendChild(t); if(id===cur) scrollChat();
    await sleep(Math.min(1400, 450 + (it.text ? it.text.length*4 : 300)));
    t.remove();
    push(id, typeof it==="string" ? {type:"maya", text:it} : it);
  }
  busy = false; syncCompose();
}

/* =====================================================================
   RUBRIC
   ===================================================================== */
function qStatus(id, qi){
  const s=st(id), Q=CASES[id].qs[qi];
  if(!s.started || (qi>s.q && !s.closed[qi])) return "none";
  const met = s.met[qi], cnt = Object.keys(met).length;
  const mustOk = Q.must.every(k=>met[k]) && (!Q.minMet || cnt>=Q.minMet);
  if(mustOk) return "met";
  if(cnt>0) return "partly";
  return s.closed[qi] || qi<s.q ? "not" : "none";
}
const stepOf = (Q) => STEPS[Q.step];
const qTag = (Q) => `${STEPS[Q.step].k}${Q.part ? Q.part.toLowerCase() : ""}`;
const qName = (Q) => Q.label || STEPS[Q.step].label;
const firstOfStep = (C, k) => C.qs.findIndex(Q => Q.step===k);
const PILL = {met:["met","Met"], partly:["partly","Partly met"], not:["not","Not yet"], none:["none","Not reached"]};
function alignment(id, i){
  const C=CASES[id], s=st(id), Q=C.qs[i], status=qStatus(id,i);
  const got=Q.points.filter(p=>s.met[i][p.id]).length, total=Q.points.length;
  let txt;
  if(status==="none") return {lvl:"none", txt:"Not reached"};
  if(status==="met") txt = got===total ? "Strongly aligned with the rubric. You covered every point in your own words."
                                       : `Strongly aligned with the rubric. You covered all key points in your own words (${got} of ${total} points).`;
  else if(status==="partly") txt = `Moderately aligned with the rubric. You covered ${got} of ${total} points, but missed at least one key point. ${C.practice?"Review the strongest example answer.":"Review Maya's complete answer in the chat."}`;
  else txt = `Weakly aligned with the rubric. The key points were missed. ${C.practice?"Review the strongest example answer.":"Review Maya's complete answer in the chat."}`;
  if(s.picked[i]!=null) txt += Q.options[s.picked[i]].best ? " You then picked the strongest example answer." : " You then picked an example answer that missed key points.";
  return {lvl: status==="met"?"strong":status==="partly"?"moderate":"weak", txt};
}

function rubricTable(id){
  const C=CASES[id], s=st(id);
  let rows = C.qs.map((Q,i)=>{
    const p = PILL[qStatus(id,i)];
    const pts = Q.points.map(pt=>`<span class="pt ${s.met[i][pt.id]?"y":"n"}">${s.met[i][pt.id]?"✓":"○"} ${esc(pt.label)}${Q.must.includes(pt.id)?" *":""}</span>`).join("");
    const a = alignment(id,i);
    return `<tr><td style="width:130px"><b>${qTag(Q)}</b><br><span style="color:var(--e-sub)">${esc(qName(Q))}</span></td><td style="width:210px"><span class="pill ${p[0]}">${p[1]}</span><div class="sub" style="margin-top:4px;font-size:11.5px;line-height:1.4">${esc(a.txt)}</div></td><td><div class="pts">${pts}</div></td></tr>`;
  }).join("");
  return `<table class="grid"><thead><tr><th>Question</th><th>Result and rubric alignment</th><th>Rubric points (* = key point)</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function feedbackText(id){
  const C=CASES[id], s=st(id);
  const statuses = C.qs.map((_,i)=>qStatus(id,i));
  const strong = statuses.filter(x=>x==="met").length >= Math.ceil(C.qs.length*0.7);
  const did=[], miss=[];
  const extra=[];
  C.qs.forEach((Q,i)=>Q.points.forEach(pt=>{ if(s.met[i][pt.id]) did.push(pt.label); else if(Q.must.includes(pt.id)) miss.push(pt.label); else extra.push(pt.label); }));
  miss.push(...extra);
  const lc = (t)=> /^[A-Z][a-z]/.test(t) ? t.charAt(0).toLowerCase()+t.slice(1) : t;
  const didTxt = did.length ? did.slice(0,3).map(lc).join("; ") : "the start of the conversation";
  const missTxt = miss.length ? lc(miss[0]) : "adding even more case-specific detail, such as exact scores and follow-up timing";
  return `Your clinical justification demonstrated a ${strong?"strong":"developing"} understanding of interprofessional collaboration. You addressed ${didTxt}. To improve, consider focusing more on ${missTxt}. Reflect on how this case mirrors the real-world challenge of ${C.reflectOn}.`;
}

/* =====================================================================
   PRACTICE ENGINE (offline stand-in for Claude, and the backup if Claude is unreachable)
   ===================================================================== */
function pointHit(p, text){
  if(p.count) return p.count.filter(r=>r.test(text)).length >= p.min;
  return p.re.test(text);
}
function firstMissing(id, qi){
  const Q=CASES[id].qs[qi], met=st(id).met[qi];
  return Q.points.find(p=>Q.must.includes(p.id) && !met[p.id]) || Q.points.find(p=>!met[p.id]);
}

async function practiceTurn(id, text){
  const C=CASES[id], s=st(id), qi=s.q, Q=C.qs[qi];
  s.tries[qi]++;
  const newly=[];
  s.qtext[qi] += " " + text;
  Q.points.forEach(p=>{ if(!s.met[qi][p.id] && pointHit(p, s.qtext[qi])){ s.met[qi][p.id]=true; newly.push(p); } });
  const flagged = Q.flag && Q.flag.re.test(text) && !(Q.flag.unless && Q.flag.unless.test(text));
  const cnt=Object.keys(s.met[qi]).length;
  const pass = Q.must.every(k=>s.met[qi][k]) && (!Q.minMet || cnt>=Q.minMet);
  const acks = newly.map(p=>p.ack).filter(Boolean).slice(0,2).join(" ");

  if(pass){
    await maya(id,[ [acks, Q.pass].filter(Boolean).join(" ") ]);
    return closeQuestion(id, "own");
  }
  if(s.tries[qi] >= CONFIG.maxTries){
    const lead = [acks, flagged?Q.flag.msg:""].filter(Boolean).join(" ");
    if(C.practice){
      await maya(id,[ (lead?lead+" ":"") + "Let's compare some example answers so you can see what a complete response looks like." ]);
      return showOptions(id, false);
    }
    await maya(id,[ (lead?lead+" ":"") + "Thanks for working through that with me. Let me share what I'd want to see.", {type:"share", text:Q.share} ]);
    return closeQuestion(id, "shared");
  }
  let reply;
  if(flagged) reply = (acks?acks+" ":"") + Q.flag.msg;
  else {
    const miss = firstMissing(id, qi);
    const lvl = Math.min(2, Math.max(s.tries[qi]-1, s.hint[qi]));
    s.hint[qi] = Math.max(s.hint[qi], lvl+1);
    const lead = acks || "Hmm, I'm not sure that gets at it yet.";
    reply = `${lead} ${miss.hints[lvl]}`;
  }
  await maya(id,[reply]);
}

/* Live Claude engine: used when CONFIG.engine === "claude".
   The page sends the student's message to the Netlify function (CONFIG.apiUrl).
   The function adds Maya's instructions, the case and the rubric, calls Claude with the
   secret API key, and returns JSON: {maya_reply, points_met:[ids], accuracy, off_topic}.
   The page keeps control of the flow (tries, hints, example answers, results). */
async function claudeTurn(id, text){
  const C=CASES[id], s=st(id), qi=s.q, Q=C.qs[qi];
  const valid = new Set(Q.points.map(p=>p.id));
  const transcript = s.log.filter(m=>m.q===qi && ["me","maya","hint"].includes(m.type))
    .map(m=>(m.type==="me"?"Student":"Maya")+": "+m.text).join("\n").slice(-6000);
  let j;
  const typing = document.createElement("div"); typing.className="typing"; typing.textContent=`${CONFIG.botName.split(" ")[0]} is typing…`;
  s.el.appendChild(typing); if(id===cur) scrollChat();
  busy = true; syncCompose();
  try{
    const ctrl = new AbortController(); const timer = setTimeout(()=>ctrl.abort(), 30000);
    const r = await fetch(CONFIG.apiUrl,{method:"POST",headers:{"Content-Type":"application/json"},signal:ctrl.signal,
      body:JSON.stringify({caseId:id, q:qi, tries:s.tries[qi], maxTries:CONFIG.maxTries,
        alreadyMet:Object.keys(s.met[qi]), transcript, message:text})});
    clearTimeout(timer);
    if(!r.ok) throw new Error("HTTP "+r.status);
    j = await r.json();
    if(typeof j.maya_reply!=="string" || !j.maya_reply.trim()) throw new Error("Bad reply");
  }catch(e){
    typing.remove(); busy=false;
    console.warn("Claude engine error:", e);
    // Answer this one message with the practice engine; the next message tries Claude again.
    if(!s.dropNoted){ s.dropNoted=true; push(id,{type:"sys",text:"Maya's connection dropped, so the practice engine answered this message. Keep going as normal."}); }
    $("engine-badge").textContent="Live: Claude (reconnecting)";
    return practiceTurn(id,text);
  }
  typing.remove(); busy=false;
  $("engine-badge").textContent="Live: Claude";
  s.tries[qi]++;
  s.qtext[qi] += " " + text;
  (j.points_met||[]).forEach(pid=>{ if(valid.has(pid)) s.met[qi][pid]=true; });
  const cnt=Object.keys(s.met[qi]).length;
  const pass = Q.must.every(k=>s.met[qi][k]) && (!Q.minMet || cnt>=Q.minMet);
  if(pass){ await maya(id,[j.maya_reply]); return closeQuestion(id,"own"); }
  if(s.tries[qi] >= CONFIG.maxTries){
    if(C.practice){ await maya(id,[j.maya_reply]); return showOptions(id,false); }
    await maya(id,[j.maya_reply, {type:"share", text:Q.share}]);
    return closeQuestion(id,"shared");
  }
  await maya(id,[j.maya_reply]);
}

async function closeQuestion(id, via){
  const s=st(id), C=CASES[id], qi=s.q, Q=C.qs[qi];
  s.via[qi]=via; s.closed[qi]=true;
  if(C.practice && via==="own"){ return showOptions(id, true); }
  await afterQuestion(id);
}

async function afterQuestion(id){
  const s=st(id), C=CASES[id], qi=s.q, Q=C.qs[qi];
  if(Q.perspective) await maya(id,[Q.perspective]);
  if(qi < C.qs.length-1){
    s.q++;
    const nq=C.qs[s.q], newStep = nq.step!==C.qs[s.q-1].step;
    push(id,{type:"div",q:s.q,text:divText(nq, newStep)});
    renderAll();
    await maya(id,[C.qs[s.q].ask]);
  } else {
    s.q = C.qs.length; // all questions done
    showRubricCard(id);

function showOptions(id, optional){
  const s=st(id), Q=CASES[id].qs[s.q];

async function pickOption(id, qi, i){
  const s=st(id), Q=CASES[id].qs[qi], o=Q.options[i];
  if(!s.awaiting || s.q!==qi) return;
  s.awaiting=false; s.picked[qi]=i;
  s.el.querySelectorAll(`[data-q="${qi}"]`).forEach(b=>{ b.disabled=true; if(+b.dataset.opt===i) b.classList.add("picked"); });
  const sk=s.el.querySelector(`[data-skip="${qi}"]`); if(sk) sk.disabled=true;
  push(id,{type:"me",text:`I'd send option ${i+1}: "${o.t}"`});
  const bestIdx = Q.options.findIndex(x=>x.best);
  const msgs=[o.why];
  if(!o.best) msgs.push(`The strongest one is option ${bestIdx+1}. ${Q.options[bestIdx].why.replace(/^This is the strongest answer\. /,"")}`);
  await maya(id,msgs);
  await afterQuestion(id);
}

async function skipOptions(id, qi){
  const s=st(id); if(!s.awaiting || s.q!==qi) return;
  s.awaiting=false;
  s.el.querySelectorAll(`[data-q="${qi}"],[data-skip="${qi}"]`).forEach(b=>b.disabled=true);
  await afterQuestion(id);
}

async function giveHint(){
  const id=cur, s=st(id);
  if(!s.started){ toast("Start the simulation first"); return; }
  if(s.ended){ toast("The simulation has ended"); return; }
  if(s.awaiting){ toast("Pick an example answer above, or skip"); return; }
  if(s.q>=CASES[id].qs.length){ toast("All questions are done. Click End Simulation for feedback"); return; }
  if(busy) return;
  if(s.hintsUsed >= CONFIG.maxHints){ toast(`You've used all ${CONFIG.maxHints} hints for this case`); return; }
  const miss = firstMissing(id, s.q);
  if(!miss){ toast("You've covered everything for this question"); return; }
  const lvl = Math.min(2, Math.max(s.hint[s.q], s.tries[s.q]));
  s.hint[s.q] = lvl+1;
  s.hintsUsed++;
  syncCompose();
  await maya(id,[{type:"hint", text:miss.hints[lvl]}]);
}

function endSim(id){
  const s=st(id); if(s.ended) return;
  if(!s.started){ toast("Start the simulation first"); return; }
  s.ended=true; s.awaiting=false;
  s.el.querySelectorAll(".opt,[data-skip]").forEach(b=>b.disabled=true);
  if(s.q<CASES[id].qs.length && s.tries[s.q]>0) s.closed[s.q]=true;
  push(id,{type:"sys",text:`Simulation ended ${now()}`});
  const fb = feedbackText(id);
  push(id,{type:"card",text:"Feedback: "+fb,html:`<h4>Feedback</h4><p>${esc(fb)}</p><div class="row"><button class="btn pri" type="button" data-copy>Copy chat and feedback</button><button class="btn" type="button" data-view-fb>See full results</button></div>`});
  view="feedback";
  renderAll();
}

async function send(){
  const id=cur, s=st(id), box=$("input"), text=box.value.trim();
  if(!text || busy) return;
  if(/^start simulation$/i.test(text)){ box.value=""; return startSim(id); }
  if(/^end simulation$/i.test(text)){ box.value=""; return endSim(id); }
  if(!s.started){ toast("Click Start Simulation first"); return; }
  if(s.ended){ toast("The simulation has ended"); return; }
  if(s.awaiting){ toast("Pick an example answer above, or skip"); return; }
  box.value="";
  push(id,{type:"me",text});
  if(s.q>=CASES[id].qs.length){ await maya(id,["Thanks! Whenever you're ready, click End Simulation and I'll give you feedback."]); return; }
  renderAll();
  if(CONFIG.engine==="claude") await claudeTurn(id,text); else await practiceTurn(id,text);
  renderAll();
}

  const lines=[`IPE Simulation: ${C.tab} (${C.tag})`, `Collaborator: ${CONFIG.botName}, ${CONFIG.botRole}`, `Date: ${new Date().toLocaleDateString()}`, ""];
  s.log.forEach(m=>{
    if(m.type==="div") lines.push("", `--- ${m.text} ---`);
    else if(m.type==="sys") lines.push(`(${m.text})`);
    else if(m.type==="me") lines.push(`[${m.time}] You: ${m.text}`);
    else if(m.type==="hint") lines.push(`[${m.time}] ${CONFIG.botName} (hint): ${m.text}`);
    else if(m.type==="share") lines.push(`[${m.time}] ${CONFIG.botName} (complete answer): ${m.text}`);
    else if(m.type==="maya") lines.push(`[${m.time}] ${CONFIG.botName}: ${m.text}`);
  });
  lines.push("", "--- Rubric results ---");
  C.qs.forEach((Q,i)=>{ const a=alignment(id,i); lines.push(`${qTag(Q)} ${qName(Q)}: ${PILL[qStatus(id,i)][1]}. ${a.lvl==="none"?"":a.txt}`.trim()); });

  const hl = highlightList(id);
  if(hl.length){ lines.push("", "--- Problems I highlighted in the chart ---"); hl.forEach(t=>lines.push("- "+t)); }

/* =====================================================================
   HIGHLIGHTER: students select chart text and mark the main problems in yellow.
   Highlights are saved per case as {key, start, end} inside [data-hlk] blocks,
   so they survive switching tabs. They are listed in the copied chat.
   ===================================================================== */
let hlSeq = 0;
function highlightBar(){
  const n = st(cur).hl.length;
  return `<div class="hlbar"><span><span class="sw"></span><b>Highlighter:</b> select text in the chart, then click <b>Highlight</b> to mark ${CASES[cur].tab}'s main problems. Click a highlight to remove it.</span><span class="sp"></span><span>${n} highlighted</span>${n?`<button class="btn" type="button" data-hl-clear>Clear all</button>`:""}</div>`;
}
function highlightList(id){
  const seen=new Set(), out=[];
  st(id).hl.forEach(h=>{ const t=h.text.replace(/\s+/g," ").trim(); if(t && !seen.has(t.toLowerCase())){ seen.add(t.toLowerCase()); out.push(t); } });
  return out;
}
function wrapRange(el, start, end, hid){
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const nodes=[]; let pos=0, n;
  while((n=walker.nextNode())){ const len=n.nodeValue.length; if(pos+len>start && pos<end) nodes.push([n,pos]); pos+=len; }
  nodes.forEach(([node,p0])=>{
    const a=Math.max(start-p0,0), b=Math.min(end-p0,node.nodeValue.length);
    if(b<=a) return;
    let mid=node;
    if(a>0) mid=node.splitText(a);
    if(b-a < mid.nodeValue.length) mid.splitText(b-a);
    if(!mid.nodeValue.trim()) return;
    const m=document.createElement("mark"); m.className="hl"; m.dataset.hid=hid; m.title="Click to remove this highlight";
    mid.parentNode.insertBefore(m, mid); m.appendChild(mid);
  });
}
function applyHighlights(root){
  st(cur).hl.forEach(h=>{ const el=root.querySelector(`[data-hlk="${h.key}"]`); if(el) wrapRange(el,h.start,h.end,h.id); });
}
function offsetIn(el, container, offset){
  const r=document.createRange(); r.setStart(el,0); r.setEnd(container,offset); return r.toString().length;
}
function addHighlightFromSelection(){
  const sel=window.getSelection(); if(!sel || sel.isCollapsed || !sel.rangeCount) return false;
  const range=sel.getRangeAt(0); let added=0;
  document.querySelectorAll("#work [data-hlk], #story [data-hlk]").forEach(el=>{
    if(!range.intersectsNode(el)) return;
    const start = el.contains(range.startContainer) ? offsetIn(el, range.startContainer, range.startOffset) : 0;
    const end = el.contains(range.endContainer) ? offsetIn(el, range.endContainer, range.endOffset) : el.textContent.length;
    const text = el.textContent.slice(start,end);
    if(end>start && text.trim()){ st(cur).hl.push({id:++hlSeq, key:el.dataset.hlk, start, end, text}); added++; }
  });
  sel.removeAllRanges();
  if(added){ renderStory(); renderWork(); }
  return added>0;
}
function removeHighlight(hid){
  const s=st(cur); s.hl = s.hl.filter(h=>String(h.id)!==String(hid)); renderStory(); renderWork();
}
function selectionInChart(){
  const sel=window.getSelection(); if(!sel || sel.isCollapsed || !sel.rangeCount) return false;
  const r=sel.getRangeAt(0);
  return [...document.querySelectorAll("#work [data-hlk], #story [data-hlk]")].some(el=>r.intersectsNode(el));

    const hl = highlightList(cur);
    body = `<div class="panel"><div class="ph">Chart Review · Today's visit <span>Scenario</span></div><div class="pb"><p data-hlk="scn">${esc(C.scenario)}</p></div></div>
      <div class="panel"><div class="ph">Main problems you've highlighted <span>${hl.length} so far</span></div><div class="pb">${hl.length?`<div class="hlchips">${hl.map(t=>`<span class="hlchip">${esc(t)}</span>`).join("")}</div>`:`<p class="sub">Nothing highlighted yet. Select text in the scenario, Patient Info, Medications or Tobacco tabs and click Highlight.</p>`}</div></div>
      <div class="panel"><div class="ph">Encounters <span>Last 12 months</span></div><div style="overflow-x:auto"><table class="grid"><thead><tr><th>Date</th><th>Type</th><th>Department</th><th>Provider</th><th>Description</th></tr></thead><tbody>${C.encounters.map((r,ri)=>`<tr>${r.map((c,ci)=>`<td${ci===4?` data-hlk="enc${ri}"`:""}>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  } else if(view==="info"){
    const val = (v)=> Array.isArray(v) ? v.map(esc).join("<br>") : esc(v);
    body = `<div class="panel"><div class="ph">Patient Information Sheet <span>${C.tab}</span></div><table class="grid"><tbody>${C.info.map((r,ri)=>`<tr><td class="lbl">${esc(r[0])}</td><td data-hlk="info${ri}">${val(r[1])}</td></tr>`).join("")}</tbody></table></div>`;
  } else if(view==="meds"){
    body = `<div class="panel"><div class="ph">Medications <span>Drug history</span></div><table class="grid"><thead><tr><th>Medication</th><th>Directions</th><th>Indication</th></tr></thead><tbody>${C.meds.map((r,ri)=>`<tr>${r.map((c,ci)=>`<td data-hlk="med${ri}-${ci}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  } else if(view==="tobacco"){
    body = `<div class="panel"><div class="ph">Tobacco Use <span>Flowsheet</span></div><table class="grid"><thead><tr><th>Measure</th><th>Value</th><th>Reference values</th></tr></thead><tbody>${C.flow.map((r,ri)=>`<tr><td>${esc(r[0])}</td><td data-hlk="tob${ri}">${r[1]}</td><td class="ref">${r[2]}</td></tr>`).join("")}</tbody></table>
      <div class="foot">${FOOTNOTES}</div></div>`;
  } else if(view==="resources"){
    body = qGuideHtml(C, s) + RESOURCES_HTML;
  } else if(view==="feedback"){
    body = `<div class="panel"><div class="ph">Feedback <span>${C.tab} · ${C.tag}</span></div><div class="pb"><p class="fbtext">${esc(feedbackText(cur))}</p></div></div>
      <div class="panel"><div class="ph">Rubric results</div><div style="overflow-x:auto">${rubricTable(cur)}</div></div>
      <div class="panel"><div class="ph">Copy your chat for the assignment <button class="btn pri" type="button" data-copy>Copy chat and feedback</button></div><div class="pb">
        <p style="color:var(--e-sub)">Includes the full chat, your rubric results, your feedback and the problems you highlighted. If the button doesn't copy, click in the box, press Ctrl+A then Ctrl+C.</p>
        <textarea class="transcript" id="transcript" readonly aria-label="Chat transcript">${esc(transcript(cur))}</textarea></div></div>`;
  }
  $("work").innerHTML = bannerHtml() + (chartViews.includes(view) ? highlightBar() : "") + body;
  applyHighlights($("work"));
  syncCompose();
}

function renderSteps(){
  const C=CASES[cur], s=st(cur), curQ = s.q<C.qs.length ? C.qs[s.q] : null;
  $("steps").innerHTML = STEPS.map((p,k)=>{
    let cls="", extra="";
    if(k<4){
      const idx = C.qs.map((Q,i)=>Q.step===k?i:-1).filter(i=>i>=0);
      const allDone = idx.every(i=>s.closed[i] || i<s.q);
      if(s.started && allDone && !(curQ && curQ.step===k && !s.ended)) cls="done";
      else if(s.started && !s.ended && curQ && curQ.step===k) cls="now";
      if(cls==="now" && curQ.part) extra = `<span class="part">Part ${curQ.part} of ${idx.length}</span>`;
    } else { if(s.ended) cls="done"; else if(s.started && s.q>=C.qs.length) cls="now"; }
    const mark = cls==="done" ? "✓" : (k<4 ? k+1 : "★");
    return `<button type="button" class="step ${cls}" data-step="${k}" ${cls==="done"?"":"tabindex='-1'"} title="${cls==="done"?"Jump to this part of the chat":""}"><span class="d">${mark}</span><b>${p.k}</b><span>${p.label}</span>${extra}</button>`;
  }).join("");
}

function syncCompose(){
  const s=st(cur), C=CASES[cur];
  const box=$("input");
  box.disabled = s.ended;
  box.placeholder = !s.started ? "Click Start Simulation to begin" : s.ended ? "Simulation ended" : s.awaiting ? "Pick an example answer above" : "Type your reply to Maya… (Enter sends · Shift + Enter for a new line)";
  $("btn-send").disabled = busy || s.ended;
  const left = Math.max(0, CONFIG.maxHints - s.hintsUsed);
  const hintOff = busy || !s.started || s.ended || s.awaiting || s.q>=C.qs.length || left===0;
  document.querySelectorAll("#btn-hint,#work [data-hint]").forEach(b=>{
    b.disabled = hintOff;
    b.textContent = left===0 ? "No hints left" : `Ask Maya for a hint (${left} left)`;
  });
  $("btn-end").disabled = !s.started || s.ended;
  $("btn-copy-top").hidden = !s.ended;
  const tr = $("tries");
  tr.textContent = s.started && !s.ended && s.q<C.qs.length && !s.awaiting ? `Try ${Math.min(s.tries[s.q]+1,CONFIG.maxTries)} of ${CONFIG.maxTries}` : "";
}

function renderChat(){
  const s=st(cur), host=$("msgs");
  if(!s.guideShown){
    s.guideShown=true;
    push(cur,{type:"card",html:guideHtml(true),text:"[Guide]"});
  }
  if(host.firstChild!==s.el){ host.innerHTML=""; host.appendChild(s.el); }
  $("chat-sub").textContent = `${CONFIG.botRole} · re: ${CASES[cur].tab}`;
  scrollChat();
}

function renderAll(){ renderTabs(); renderStory(); renderWork(); renderSteps(); renderChat(); syncCompose(); }

/* =====================================================================
   EVENTS
   ===================================================================== */
document.addEventListener("click", e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.case){ cur=t.dataset.case; view = st(cur).ended ? "feedback" : "chart"; $("confirm-end").hidden=true; renderAll(); return; }
  if(t.dataset.view){ view=t.dataset.view; renderWork(); return; }
  if(t.dataset.goto){ view=t.dataset.goto; renderWork(); return; }
  if(t.hasAttribute("data-start")){ startSim(cur); return; }
  if(t.hasAttribute("data-hint")){ giveHint(); return; }
  if(t.hasAttribute("data-end")){ $("confirm-end").hidden=false; return; }
  if(t.hasAttribute("data-copy")){ copyTranscript(); return; }
  if(t.hasAttribute("data-view-fb")){ view="feedback"; renderWork(); return; }
  if(t.hasAttribute("data-guide")){ openGuide(); return; }
  if(t.dataset.opt!==undefined){ pickOption(cur, +t.dataset.q, +t.dataset.opt); return; }
  if(t.dataset.skip!==undefined){ skipOptions(cur, +t.dataset.skip); return; }
  if(t.dataset.step!==undefined && t.classList.contains("step") && t.classList.contains("done")){
    const i=+t.dataset.step;
    const el = i<4 ? document.getElementById(`${cur}-div-${firstOfStep(CASES[cur], i)}`) : st(cur).el.lastElementChild;
    if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
});
$("btn-send").addEventListener("click", send);
// Highlighter events
const hlBtn = $("hl-btn");
document.addEventListener("mouseup", e=>{
  if(e.target.closest("#hl-btn")) return;
  setTimeout(()=>{
    if(selectionInChart()){
      hlBtn.style.left = Math.min(e.clientX+8, window.innerWidth-110)+"px";
      hlBtn.style.top = Math.max(e.clientY-38, 8)+"px";
      hlBtn.hidden = false;
    } else hlBtn.hidden = true;
  }, 0);
});
hlBtn.addEventListener("mousedown", e=>e.preventDefault());
hlBtn.addEventListener("click", ()=>{ addHighlightFromSelection(); hlBtn.hidden=true; });
document.addEventListener("click", e=>{
  const m=e.target.closest("mark.hl");
  if(m && !window.getSelection().toString()){ removeHighlight(m.dataset.hid); return; }
  if(e.target.closest("[data-hl-clear]")){ st(cur).hl=[]; renderStory(); renderWork(); }
});
$("work").addEventListener("scroll", ()=>{ hlBtn.hidden=true; });
// Warn before a refresh or close wipes the chat.
window.addEventListener("beforeunload", e=>{
  const unsaved = Object.values(S).some(x=>x.log.some(m=>m.type==="me") || x.hl.length);
  if(unsaved){ e.preventDefault(); e.returnValue=""; }
});
$("input").addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); } });
$("btn-hint").addEventListener("click", giveHint);
$("btn-end").addEventListener("click", ()=>{ $("confirm-end").hidden=false; });
$("end-no").addEventListener("click", ()=>{ $("confirm-end").hidden=true; });
$("end-yes").addEventListener("click", ()=>{ $("confirm-end").hidden=true; endSim(cur); });
$("btn-copy-top").addEventListener("click", copyTranscript);
function openGuide(){ $("modal-body").innerHTML = guideHtml(false); $("modal").hidden=false; $("modal-close").focus(); }
$("btn-guide").addEventListener("click", openGuide);
$("modal-close").addEventListener("click", ()=>{ $("modal").hidden=true; });
$("modal").addEventListener("click", e=>{ if(e.target.id==="modal") $("modal").hidden=true; });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") $("modal").hidden=true; });

// Link options: #lucy, #brian or #margaret opens that case
(function(){ const h=(location.hash||"").slice(1); if(CASES[h]) cur=h; })();
$("engine-badge").textContent = CONFIG.engine==="claude" ? "Live: Claude" : "Practice engine · no AI";
renderAll();
</script>

</body></html>
