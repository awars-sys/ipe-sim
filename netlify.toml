# Netlify settings for the IPE Dental Collaborator.
# No build step: Netlify publishes the "public" folder as the website
# and turns netlify/functions/maya.mjs into the /api/maya server address.

[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Never cache the page or case file, so students always get the latest version after you edit.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
